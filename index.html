<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KittySquared — Juego de Puzzles de Lógica</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#FBF9F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KittySquared" />
    <script>
      (function() {
        var p = window.location.pathname;
        var idx = p.indexOf('/debug/');
        if (idx >= 0) {
          var base = p.slice(0, idx);
          var route = p.slice(idx + 1);
          window.location.replace((base ? base + '/' : '/') + '#/' + route + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
